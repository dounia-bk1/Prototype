<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cours de soutien — prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#12284C;--navy2:#0C1B33;--gold:#C9962B;--goldtx:#7A5710;--bg:#EEF0F3;--card:#fff;--ink:#1B2433;--mut:#5B6678;--line:#D9DDE4;
--pend:#8A5A00;--pendb:#FFF1D0;--ok:#1E6B45;--okb:#DDF2E6;--no:#9B2C2C;--nob:#FBE0E0;--late:#A3350F;--lateb:#FFE3D6;--up:#1F4E96;--upb:#DEE9FA}
@media (prefers-color-scheme:dark){:root{--bg:#0E1522;--card:#17202F;--ink:#E8ECF3;--mut:#9AA6BA;--line:#2A3548;--goldtx:#E3B552;--navy:#2A4A82;--pendb:#3A2E10;--pend:#F0C060;--okb:#143324;--ok:#7BD8A4;--nob:#3A1818;--no:#F29B9B;--lateb:#3A1D10;--late:#F5A27F;--upb:#15294A;--up:#9CC0F5}}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'Readex Pro',system-ui,sans-serif}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:#1B1400;border-color:var(--gold);font-weight:600}
.btn.sec{background:transparent;color:inherit;border-color:currentColor}
.wrap{max-width:1040px;margin:auto;padding:0 16px}
header.top{background:var(--navy2);color:#fff;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.logo{font-weight:700;letter-spacing:.2px;border:1.5px dashed var(--gold);padding:2px 10px;border-radius:6px;color:#fff;background:none;min-height:0}
header nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
header button{background:transparent;color:#fff;border-color:transparent;padding:0 10px}
header button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.demo{background:#22314E;color:#cfd7e6;font-size:13px}.demo .wrap{display:flex;gap:8px;align-items:center;padding-block:6px;flex-wrap:wrap}
.demo button{min-height:32px;font-size:13px;background:transparent;color:#fff;border-color:#5b6b8c}.demo button[aria-pressed=true]{background:var(--gold);color:#1B1400;border-color:var(--gold)}
.hero{background:var(--navy);color:#fff;padding:36px 0 44px}
.hero h1{font-size:clamp(28px,6vw,48px);line-height:1.2;margin:0 0 12px;font-weight:600;max-width:16em}
.hero p{max-width:34em;color:#cdd6e6;margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hgrid{display:grid;gap:28px;align-items:center}@media(min-width:800px){.hgrid{grid-template-columns:1.2fr 1fr}}
.tt{background:var(--navy2);border:1px solid #34476b;border-radius:14px;padding:14px}
.tt h3{margin:0 0 8px;font-size:14px;color:#cdd6e6;font-weight:500}
.tt .slot{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #2b3c5e;font-size:14px}
.tt .slot b{color:var(--gold)}
section.sec{padding:28px 0}h2{font-size:22px;margin:0 0 14px;font-weight:600}
.grid{display:grid;gap:12px}@media(min-width:700px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.reg{border-inline-start:5px solid var(--navy)}.card.part{border-inline-start:5px solid var(--gold);background:linear-gradient(var(--card),var(--card))}
.mut{color:var(--mut);font-size:14px}.gold{color:var(--goldtx);font-weight:600}
.badge{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.pending{background:var(--pendb);color:var(--pend)}.approved,.ok{background:var(--okb);color:var(--ok)}.rejected,.full{background:var(--nob);color:var(--no)}.late{background:var(--lateb);color:var(--late)}.upcoming,.open{background:var(--upb);color:var(--up)}.near{background:var(--pendb);color:var(--pend)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}select,input{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink);width:100%}
.filters select{width:auto;min-width:150px}
label{display:block;margin:10px 0 4px;font-size:14px;font-weight:500}
[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
.lock{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut)}
.next{background:var(--navy);color:#fff;border-radius:16px;padding:18px}.next .t{font-size:30px;font-weight:600;line-height:1.1}
.next .btn{margin-top:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.days button{padding:6px 0;min-height:56px;font-size:13px;line-height:1.3}.days button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.dot{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--gold)}
.mixed{border-inline-start:3px solid var(--gold);padding:4px 12px;background:var(--bg);border-radius:6px;font-size:14px;margin-top:8px}
nav.bot{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.bot button{flex:1;border:0;border-radius:0;min-height:56px;font-size:12px;background:transparent}nav.bot button[aria-pressed=true]{color:var(--goldtx);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.pad{padding-bottom:84px}
@media(min-width:800px){nav.bot{position:static;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.pad{padding-bottom:24px}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;inset-inline:16px;bottom:76px;background:var(--navy2);color:#fff;padding:12px 16px;border-radius:10px;z-index:9;border:1px solid var(--gold)}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>

tmsg:"نص كتبه الأستاذ (غير مترجم)",mat1:"Chapitre 4 — Suites numériques (PDF)",fb:"ملاحظة الأستاذ",fbt:"Bon raisonnement, mais n'oubliez pas de justifier la récurrence.",
days:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],demo:"عرض:",d1:"طالب جديد (قيد الانتظار)",d2:"طالب مقبول",ok:"تم إرسال الطلب. الحالة: قيد الانتظار.",sess:"الحصص",x:"Exercice 3 : suites",y:"Problème de dynamique"}};
const G=[
{id:1,c:"Math",lv:"3AS",type:"regular",days:[0,2],t:"17:00",fee:4500,cap:20,n:12},
{id:2,c:"Math",lv:"3AS",type:"part",days:[4],t:"18:30",fee:7000,cap:8,n:8},
{id:3,c:"Phys",lv:"2AS",type:"regular",days:[1,3],t:"16:00",fee:4000,cap:20,n:18},
{id:4,c:"Phys",lv:"2AS",type:"regular",days:[5],t:"10:00",fee:4000,cap:20,n:6},
{id:5,c:"Fr",lv:"1AS",type:"regular",days:[2],t:"15:00",fee:3500,cap:25,n:10}];
const s={lang:'fr',view:'home',lv:'all',sb:'all',g:null,auth:'login',mode:'approved',day:1,tab:'today',toast:'',cancelled:false};
const t=k=>L[s.lang][k];
const st=g=>g.n>=g.cap?'full':(g.cap-g.n<=3?'near':'open');
const ico={pending:'◔',approved:'✓',rejected:'✕',late:'!',upcoming:'›',full:'✕',near:'!',open:'✓',ok:'✓'};
const badge=(k,txt)=>`<span class="badge ${k}"><span aria-hidden="true">${ico[k]||''}</span>${txt||t(k)}</span>`;
const arr='<span class="arr" aria-hidden="true">→</span>';
function go(v,x){s.view=v;if(x)Object.assign(s,x);window.scrollTo(0,0);R()}
function lang(l){s.lang=l;R()}
function gcard(g){const q=st(g);return `<div class="card ${g.type==='part'?'part':'reg'}"><div class="row" style="justify-content:space-between"><b>${t(g.c)} · ${g.lv}</b>${badge(q,q==='full'?t('full'):q==='near'?t('near'):t('open'))}</div>
<div class="mut">${g.type==='part'?'★ ':''}${t(g.type==='part'?'part':'regular')} · ${g.days.map(d=>t('days')[d]).join(' / ')} ${g.t}</div>
<div style="margin:8px 0"><span class="gold">${g.fee.toLocaleString(s.lang==='ar'?'ar-DZ':s.lang)} DA</span> <span class="mut">${t('perm')}</span> · <span class="mut">${Math.max(0,g.cap-g.n)} ${t('places')}</span></div>
<button class="btn" onclick="go('group',{g:${g.id}})">${t('request')} ${arr}</button></div>`}
function home(){const f=G.filter(g=>[1,3,5].includes(g.id));
return `<div class="hero"><div class="wrap hgrid"><div><h1>${t('h1')}</h1><p>${t('hp')}</p><div class="row"><button class="btn" onclick="go('cat')">${t('cat')} ${arr}</button><button class="btn sec" onclick="go('auth',{auth:'register'})">${t('reg')}</button></div></div>
<div class="tt" aria-label="${t('week')}"><h3>${t('week')}</h3>${[[0,'Math','3AS','17:00'],[1,'Phys','2AS','16:00'],[2,'Fr','1AS','15:00']].map(r=>`<div class="slot"><b>${t('days')[r[0]]}</b><span>${t(r[1])} ${r[2]}</span><span>${r[3]}</span></div>`).join('')}</div></div></div>
<section class="sec"><div class="wrap"><h2>${t('feat')}</h2><div class="grid c3">${f.map(gcard).join('')}</div></div></section>`}
function cat(){const l=['all','1AS','2AS','3AS'],su=['all','Math','Phys','Fr'];
const list=G.filter(g=>(s.lv==='all'||g.lv===s.lv)&&(s.sb==='all'||g.c===s.sb));
return `<div class="wrap" style="padding-block:24px"><h2>${t('cat')}</h2><div class="filters"><select aria-label="${t('lvl')}" onchange="s.lv=this.value;R()">${l.map(x=>`<option value="${x}" ${s.lv===x?'selected':''}>${t('lvl')}: ${x==='all'?t('all'):x}</option>`).join('')}</select>
<select aria-label="${t('sub')}" onchange="s.sb=this.value;R()">${su.map(x=>`<option value="${x}" ${s.sb===x?'selected':''}>${t('sub')}: ${x==='all'?t('all'):t(x)}</option>`).join('')}</select></div>
<div class="grid c3">${list.map(gcard).join('')||'<div class="lock">—</div>'}</div></div>`}
function group(){const g=G.find(x=>x.id===s.g),q=st(g);
return `<div class="wrap" style="padding-block:24px;max-width:680px"><button onclick="go('cat')"><span class="arr">←</span> ${t('back')}</button>
<h2 style="margin-top:14px">${t(g.c)} · ${g.lv}</h2><div class="card">${gcard({...g}).replace(/<button.*<\/button>/s,'')}
<p><b>${t('obj')}</b><br><span class="mut">Suites, limites, dérivation, probabilités — préparation au baccalauréat.</span></p><div class="mixed" lang="fr" dir="ltr"><span class="mut">${t('tmsg')}</span><br>« Chaque séance se termine par un exercice type bac. »</div>
<p class="mut">${t('teach')} : M. Benali</p>${q==='full'?`<p>${badge('full')} ${t('fullmsg')}</p>`:''}
<button class="btn" onclick="go('auth',{auth:'login',next:'enroll'})">${t('request')} ${arr}</button></div></div>`}
function auth(){const m=s.auth,f=(k,ty='text')=>`<label>${t(k)}</label><input type="${ty}">`;
return `<div class="wrap" style="padding-block:28px;max-width:420px"><div class="card"><h2>${m==='register'?t('reg'):m==='forgot'?t('forgot'):t('login')}</h2>
${m==='register'?f('name'):''}${f('email','email')}${m!=='forgot'?f('pwd','password'):''}
<div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="${m==='forgot'?"s.toast=t('resetok');R()":"s.mode=s.next==='enroll'?'pending':s.mode;go(s.next||'dash',{next:null})"}">${m==='forgot'?t('reset'):m==='register'?t('reg'):t('login')}</button></div>
<p class="mut" style="display:flex;justify-content:space-between;gap:8px"><a href="#" onclick="s.auth='forgot';R();return false" style="color:var(--goldtx)">${t('forgot')}</a><a href="#" onclick="s.auth='${m==='register'?'login':'register'}';R();return false" style="color:var(--goldtx)">${m==='register'?t('login'):t('reg')}</a></p></div></div>`}
const SS=[{d:1,t:"16:00",c:"Phys",l:"2AS",own:1},{d:2,t:"15:00",c:"Fr",l:"1AS",own:0,single:1},{d:0,t:"17:00",c:"Math",l:"3AS",own:1},{d:2,t:"17:00",c:"Math",l:"3AS",own:1}];
function sessCard(x){return `<div class="card" style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><b>${t(x.c)} ${x.l}</b><span>${t('days')[x.d]} ${x.t}</span></div>${x.single?badge('upcoming',t('single')):''}<div style="margin-top:6px"><button class="btn" ${x.d!==s.day&&false?'disabled':''} onclick="s.toast='Lien externe (Meet) →';R()">${t('join')}</button></div></div>`}
function lockBox(){return `<div class="lock"><div style="font-size:22px" aria-hidden="true">🔒</div>${t('locked')}</div>`}
function reqs(){const rows=s.mode==='pending'&&!s.cancelled?[['pending','Math','3AS',0]]:s.mode==='pending'?[]:[['approved','Phys','2AS',0],['pending','Math','3AS',0],['rejected','Fr','1AS',1]];
return `<h2>${t('reqs')}</h2>${rows.map(r=>`<div class="card" style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><b>${t(r[1])} ${r[2]}</b>${badge(r[0])}</div>
${r[0]==='pending'?`<button style="margin-top:8px" onclick="s.cancelled=true;R()">${t('cancel')}</button>`:''}${r[0]==='approved'?`<button style="margin-top:8px">${t('leave')}</button>`:''}${r[3]?`<p class="mut">${t('reason')} <span lang="fr" dir="ltr">« Niveau non concerné. »</span></p>`:''}</div>`).join('')}`}
function dash(){const T=['today','sched','ex','prog','reqs'],lab={today:t('today'),sched:t('sched'),ex:t('ex'),prog:t('prog'),reqs:t('reqs')},ic={today:'●',sched:'▦',ex:'✎',prog:'◔',reqs:'☰'};
let body;const P=s.mode==='pending';

<div><div class="card"><b>${ta('pv')}</b><div style="pointer-events:none;margin-top:8px">${gcard(G.find(x=>x.id===A.pv))}</div></div><div class="card" style="margin-top:12px"><h2>${ta('newg')}</h2><label>${t('sub')}</label><select id="nc">${['Math','Phys','Fr'].map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select><label>${t('lvl')}</label><select id="nl"><option>1AS</option><option>2AS</option><option>3AS</option></select><label>${tt('instr')}</label><input lang="fr"><label>${t('fees')} (DA)</label><input type="number" id="nf" value="4000"><label>${t('regular')} / ${t('part')}</label><select id="nt"><option value="regular">${t('regular')}</option><option value="part">${t('part')}</option></select><label>${ta('cap')}</label><input type="number" id="ncap" value="20"><p><button class="btn" onclick="G.push({id:Date.now()%1e6,c:nc.value,lv:nl.value,type:nt.value,days:[3],t:'18:00',fee:+nf.value,cap:+ncap.value,n:0});logA('Created group',nc.value+' '+nl.value);TOAST(ta('create'))">${ta('create')}</button></p></div></div></div>`}
function aSch(){const {all,o}=cfl();
return `<div class="cal">${t('days').map((d,i)=>`<div class="card"><b>${d}</b>${all.filter(x=>x.d===i).sort((a,b)=>mn(a.t)-mn(b.t)).map(x=>`<div class="chip" style="display:block;border-radius:8px;margin-top:4px"><span lang="fr" dir="ltr">${x.t} ${x.ti}</span><br><span class="mut">${x.by}</span></div>`).join('')}</div>`).join('')}</div>
<div style="margin-top:14px">${o.map(c=>c.teach?`<div class="block">✕ ${c.x.by} : ${c.x.ti} ↔ ${c.y.ti}</div>`:`<div class="warn" role="status"><b>! ${ta('confl')}</b><br><span lang="fr" dir="ltr">${c.x.ti} ↔ ${c.y.ti}</span><br>${c.ids.map(z=>`<span class="chip">${z[1]}</span>`).join('')}</div>`).join('')}</div>`}
function aAnn(){const n=A.us.filter(u=>u.on&&(A.aa==='all'||(A.aa==='students')===(u.r==='s'))).length,pub=()=>{A.an.unshift({a:A.aa,m:A.am||'…',d:now().split(',')[0]});logA('Published announcement',A.aa);TOAST(tt('saved'))};window.pubA=pub;
return `<div class="two"><div class="card"><label>${tt('who')}</label>${[['all',ta('allu')],['students',ta('onlyS')],['teachers',ta('onlyT')]].map(x=>`<label class="chk"><input type="radio" name="aa" ${A.aa===x[0]?'checked':''} onchange="A.aa='${x[0]}';R()">${x[1]}</label>`).join('')}
<div class="sum"><b>${tt('aud')} : ${A.aa==='all'?ta('allu'):A.aa==='students'?ta('onlyS'):ta('onlyT')}</b><div>${ta('reach')} ${n}</div></div><label>${ta('msg')}</label><textarea lang="fr" onchange="A.am=this.value"></textarea><p><button class="btn" onclick="${'A.aa===\'all\'?ask(ta(\'allu\')+\' (\'+'+n+'+\')\',pubA):pubA()'}">${ta('send')}</button></p></div>
<div>${A.an.map(a=>`<div class="card" style="margin-bottom:6px"><span class="chip">${a.a==='all'?ta('allu'):a.a==='students'?ta('onlyS'):ta('onlyT')}</span> <span class="mut">${a.d}</span><div lang="fr" dir="ltr">${a.m}</div></div>`).join('')}</div></div>`}
const aSet=()=>`<div class="card"><b>${ta('langs')}</b><div>${['العربية','Français','English'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>${['tog1','tog2'].map((k,i)=>`<label class="chk"><input type="checkbox" ${A.on[i]?'checked':''} onchange="A.on[${i}]=this.checked?1:0">${ta(k)}</label>`).join('')}</div>`;
const aHist=()=>`<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:start"><tr class="mut">${['hw','ha','hr','hd'].map(k=>`<th style="text-align:start;padding:6px">${ta(k)}</th>`).join('')}</tr>${A.lg.map(l=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px">Admin</td><td style="padding:6px">${l.a}</td><td style="padding:6px" lang="fr" dir="ltr">${l.r}</td><td style="padding:6px">${l.d}</td></tr>`).join('')}</table></div>`;
function admin(){const T=[['dash',ta('dash')],['rq',ta('arq')+' ('+(pend('enr')+pend('leave'))+')'],['acc',ta('acc')],['crs',ta('crs')],['sch',ta('sch')],['ann',ta('ann')],['set',ta('set')],['hist',ta('hist')]];
return `<div class="wrap tw" style="padding-block:16px"><div class="tabs">${T.map(x=>`<button aria-pressed="${A.tab===x[0]}" onclick="A.tab='${x[0]}';A.cf=null;R()">${x[1]}</button>`).join('')}</div>${A.cf?`<div class="card" style="border:2px solid var(--gold);margin-bottom:12px"><p>${A.cf.m}</p><div class="row"><button class="btn" onclick="okc()">${tt('confirm')}</button><button onclick="A.cf=null;R()">${t('cancel')}</button></div></div>`:''}${{dash:aDash,rq:aRq,acc:aAcc,crs:aCrs,sch:aSch,ann:aAnn,set:aSet,hist:aHist}[A.tab]()}</div>`}
document.head.insertAdjacentHTML('beforeend','<style>.cal{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.tw button.card[aria-pressed=true]{border-color:var(--gold);background:var(--card);color:var(--ink);box-shadow:inset 4px 0 0 var(--gold)}</style>');

R();
</script>
</body>
</html>
